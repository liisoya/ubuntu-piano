# Build RootFS (piano) —— ubuntu-sheng chroot 模型 + piano 设备件
#
# 架构：ADR-0008（debian-piano tar 模型 → ubuntu-sheng chroot 模型）。
# 装配链：components/kernel/packages 三 job 产 deb 与 boot.img →
#         build-rootfs job 建镜像挂载 chroot：bootstrap → dpkg -i 全部 deb
#         （内核 deb 含模块，postinst depmod）→ 系统配置（autologin 按输入现写）
#         → gate → 卸载 → e2fsck + resize2fs -M 收缩 → 上传紧凑 rootfs.img。
# 参考：code002-2/ubuntu-sheng（scripts/ 全族照抄移植，piano 化只换设备件）。

name: Build RootFS (piano)

on:
  workflow_dispatch:
    inputs:
      # --- 系统形态 ---
      ubuntu_series:
        description: 'Ubuntu 版本（26.04 = resolute LTS）'
        type: choice
        options: ['26.04', '25.10']
        default: '26.04'
      desktop:
        description: '桌面环境（server = 无 DE）'
        type: choice
        options: ['KDE Plasma', 'GNOME', 'server']
        default: 'KDE Plasma'
      autologin:
        description: '自动登录（SDDM autologin.conf 按 input 现写）'
        type: boolean
        default: true
      boot_mode:
        description: '启动分区模式：dual=linux-root（双系统）/ single=userdata（独占，毁 Android 数据）/ custom'
        type: choice
        options: ['dual (linux-root)', 'single (userdata)', 'custom']
        default: 'dual (linux-root)'
      custom_partition:
        description: 'custom 模式的分区 PARTLABEL'
        type: string
        default: ''
      quiet_boot:
        description: 'Plymouth 静默启动'
        type: boolean
        default: true
      username:
        description: '用户名'
        type: string
        default: 'piano'
      hostname:
        description: '主机名'
        type: string
        default: 'piano'
      password:
        description: '镜像密码（普通用户与 root 同密码；留空用 Secret ROOTFS_PASSWORD，再空为 password）'
        type: string
        default: ''
      ssh_auth:
        description: 'SSH 认证：password（与镜像密码一致）/ keys-only（配 PIANO_SSH_PUBLIC_KEY 变量）'
        type: choice
        options: ['password', 'keys-only']
        default: 'password'
      language:
        description: '语言'
        type: string
        default: 'zh_CN.UTF-8'
      extras:
        description: '附加安装（逗号分隔）：fcitx5 / compression / browser-firefox / browser-chrome / dev-tools / docker'
        type: string
        default: 'fcitx5,compression'
      # --- 镜像工程 ---
      rootfs_size:
        description: '镜像初始大小（构建后收缩，首启 growfs 扩满）'
        type: string
        default: '10G'
      shrink_image:
        description: '构建后 e2fsck + resize2fs -M 收缩'
        type: boolean
        default: true
      produce_tar:
        description: '额外上传 rootfs 树 tar.zst（进阶用户自改树用；默认只发 img）'
        type: boolean
        default: false
      # --- 来源 pin ---
      kernel_repo:
        description: '内核仓库（owner/repo）'
        type: string
        default: 'blu-sharky/linux-piano'
      kernel_branch:
        description: '内核分支'
        type: string
        default: 'piano-7.2.6'
      firmware_ref:
        description: 'piano-firmware 修订'
        type: string
        default: 'main'
      mesa_ref:
        description: 'piano-mesa 修订'
        type: string
        default: 'main'
      sensors_ref:
        description: 'piano-sensors 修订'
        type: string
        default: 'main'
      mipps_ref:
        description: 'piano-mipps-auth 修订'
        type: string
        default: 'main'

permissions:
  contents: read
  actions: read
  packages: read

# 产物名是跨 job 的契约（生产者 upload-artifact / 消费者 download-artifact 必须逐字一致），
# 因此**只在这里声明一次**，四处引用 env.*。历史教训（run 38522113641 / 38523614571）：
# 同一个名字在 YAML 里抄两遍就会漂移，而漂移的表现是"下载步骤静默成功、40 分钟后在
# 下游以一条误导性错误炸掉"。
env:
  ART_FLASH: piano-kde-flash-${{ github.sha }}
  ART_KERNEL_DEB: piano-kernel-deb-${{ github.sha }}
  ART_COMPONENTS: piano-components-${{ github.sha }}
  ART_DEBS: piano-debs-${{ github.sha }}

jobs:
  # ---------------------------------------------------------------------------
  # 1) components：mesa / sensors / mipps 设备 deb（照 legacy，已验证）
  # ---------------------------------------------------------------------------
  components:
    name: Build Device Packages
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }

      - name: Checkout piano Mesa
        uses: actions/checkout@v5
        with:
          repository: blu-sharky/piano-mesa
          ref: ${{ inputs.mesa_ref }}
          path: workspace/piano-mesa
          persist-credentials: false

      - name: Checkout piano sensors
        uses: actions/checkout@v5
        with:
          repository: blu-sharky/piano-sensors
          ref: ${{ inputs.sensors_ref }}
          path: workspace/piano-sensors
          persist-credentials: false

      - name: Checkout piano MiPPS authentication
        uses: actions/checkout@v5
        with:
          repository: blu-sharky/piano-mipps-auth
          ref: ${{ inputs.mipps_ref }}
          path: workspace/piano-mipps-auth
          persist-credentials: false

      - name: Install build dependencies
        run: |
          # runner 镜像自带 docker（moby）：不要装 docker.io，会与预装版本冲突
          command -v docker >/dev/null || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends docker.io
          }
          docker version
          sudo apt-get install -y --no-install-recommends python3

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: piano-components-clang-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: piano-components-clang-${{ runner.os }}-${{ runner.arch }}-

      - name: Build Mesa (resolute variant, vendored piano-mesa)
        run: |
          # vendored piano-mesa 是 resolute 变体（kisak 源 + A830v1 chip-id）
          piano-mesa/scripts/build-in-container.sh out/mesa "$CCACHE_DIR"
          echo "piano-mesa resolute-variant (vendored)" > out/mesa/SOURCE

      - name: Build sensors packages
        working-directory: workspace
        run: |
          piano-sensors/scripts/build-in-container.sh ../out/sensors
          echo "piano-sensors $(git -C piano-sensors rev-parse HEAD)" > ../out/sensors/SOURCE

      - name: Build MiPPS package
        working-directory: workspace
        run: |
          mkdir -p ../out/userspace
          cp ../out/sensors/runtime/*.deb ../out/userspace/
          piano-mipps-auth/build-deb.sh "$GITHUB_WORKSPACE/out/userspace/xiaomi-mipps-auth.deb"
          echo "piano-mipps-auth $(git -C piano-mipps-auth rev-parse HEAD)" > ../out/userspace/SOURCE

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: piano-components-clang-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ART_COMPONENTS }}
          path: out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 2) packages：piano-userspace deb + firmware-piano deb
  # ---------------------------------------------------------------------------
  packages:
    name: Build piano debs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }

      - name: Build piano-userspace deb
        run: |
          ./scripts/packages/build-piano-userspace.sh
          dpkg-deb -I piano-userspace.deb | head -5

      - name: Build firmware-piano deb
        env:
          FIRMWARE_REPO: https://github.com/blu-sharky/piano-firmware
          FIRMWARE_BRANCH: ${{ inputs.firmware_ref }}
        run: |
          ./scripts/packages/build-firmware-piano.sh
          dpkg-deb -I firmware-piano.deb | head -5

      - name: Verify debs
        run: |
          test -s piano-userspace.deb
          test -s firmware-piano.deb
          dpkg-deb -f piano-userspace.deb Package | grep -qx piano-userspace
          dpkg-deb -f firmware-piano.deb Package | grep -qx firmware-piano

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ART_DEBS }}
          path: |
            piano-userspace.deb
            firmware-piano.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 3) kernel：blu-sharky 树 + 补丁集 → Image/modules/dtbs + initramfs + boot.img(AVB) + 内核 deb
  # ---------------------------------------------------------------------------
  kernel:
    name: kernel + boot.img + deb
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 8G
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }

      - name: Normalize kernel repo (accept owner/repo or full URL)
        env:
          KERNEL_REPO_INPUT: ${{ inputs.kernel_repo }}
        run: |
          repo="${KERNEL_REPO_INPUT#https://github.com/}"
          repo="${repo#http://github.com/}"
          repo="${repo%.git}"
          echo "KERNEL_REPO=$repo" >> "$GITHUB_ENV"

      - name: Checkout kernel source
        uses: actions/checkout@v5
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ inputs.kernel_branch }}
          path: workspace/linux-piano
          persist-credentials: false

      - name: Checkout piano firmware
        uses: actions/checkout@v5
        with:
          repository: blu-sharky/piano-firmware
          ref: ${{ inputs.firmware_ref }}
          path: workspace/piano-firmware
          persist-credentials: false

      - name: Checkout v4l2loopback (camera loopback, GPL-2.0)
        uses: actions/checkout@v5
        with:
          repository: umlaeute/v4l2loopback
          ref: 0f9ee86760b7f2bea174b7e3e7a1d38845da0ab4
          path: workspace/v4l2loopback
          persist-credentials: false

      - name: Checkout AudioReach topology macros (BSD-3)
        uses: actions/checkout@v5
        with:
          repository: linux-msm/audioreach-topology
          ref: 993a17dcb672357998a463a73f120064d6c74f4f
          path: workspace/audioreach-topology
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              clang lld llvm ccache make flex bison bc libssl-dev libelf-dev \
              rsync cpio kmod device-tree-compiler curl openssh-client \
              openssl e2fsprogs python3 zstd xz-utils lz4 m4 alsa-utils
          test -s /usr/share/keyrings/ubuntu-archive-keyring.gpg

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: piano-kde-clang-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: piano-kde-clang-${{ runner.os }}-${{ runner.arch }}-

      - name: Inject dual-boot cmdline into piano_rootfs.config
        working-directory: workspace/linux-piano
        run: |
          cfg=arch/arm64/configs/piano_rootfs.config
          test -f "$cfg"
          sed -i 's/root=PARTLABEL=userdata/root=PARTLABEL=linux-root/; s/CONFIG_LOCALVERSION="-piano-gnome"/CONFIG_LOCALVERSION="-piano-kde"/' "$cfg"
          grep -q 'root=PARTLABEL=linux-root' "$cfg" || { echo 'cmdline injection failed' >&2; exit 1; }
          git diff > "$GITHUB_WORKSPACE/piano_rootfs.config.diff"

      - name: Apply kernel patch series (ADR-0006)
        working-directory: workspace/linux-piano
        run: |
          patchdir="$GITHUB_WORKSPACE/kernel/patches"
          if ! compgen -G "$patchdir/*.patch" >/dev/null; then
            echo "no kernel patches; baseline as-is"; exit 0
          fi
          for p in $(ls "$patchdir"/*.patch | LC_ALL=C sort); do
            echo "applying $(basename "$p")"
            git apply --check "$p" || { echo "PATCH NOT CLEAN: $p" >&2; exit 1; }
            git apply "$p"
            sha256sum "$p"
          done
          git diff > "$GITHUB_WORKSPACE/kernel-patches.diff"

      - name: Build kernel + initramfs (ci/build.sh --stage kernel)
        env:
          SSH_PUBLIC_KEY: ${{ vars.PIANO_SSH_PUBLIC_KEY }}
        run: |
          mkdir -p out
          key_args=()
          if [ -n "$SSH_PUBLIC_KEY" ]; then
            printf '%s\n' "$SSH_PUBLIC_KEY" > out/authorized_keys
          else
            ssh-keygen -q -t ed25519 -N '' -C piano -f out/access-key
            cp out/access-key.pub out/authorized_keys
          fi
          key_args=(--authorized-keys "$PWD/out/authorized_keys")
          ccache --zero-stats
          bash -x ci/build.sh --stage kernel \
              --kernel-tree workspace/linux-piano \
              --firmware-tree workspace/piano-firmware/firmware \
              --v4l2loopback workspace/v4l2loopback \
              --audioreach-topology workspace/audioreach-topology \
              --jobs "$(nproc)" --output out/image "${key_args[@]}"

      - name: Generate boot.img + dtbo.img (AVB)
        run: |
          O="$GITHUB_WORKSPACE/workspace/linux-piano/out/rootfs-image"
          K="$GITHUB_WORKSPACE/workspace/linux-piano"
          debian-piano/scripts/build-test-bootimg.sh \
            --kernel-dir "$O" --output-dir "$GITHUB_WORKSPACE/out/image" \
            --kernel-include "$K/include" \
            --dtbo-source debian-piano/boot/dtbo-piano-power.dts --mode rootfs
          debian-piano/scripts/sign-boot-avb.sh "$GITHUB_WORKSPACE/out/image/boot.img"
          echo "boot.img: AVB-signed; sha256 $(sha256sum "$GITHUB_WORKSPACE/out/image/boot.img" | cut -d' ' -f1)"

      - name: Pack kernel deb
        run: |
          KVER="$(cat workspace/linux-piano/out/rootfs-image/include/config/kernel.release)"
          O="$GITHUB_WORKSPACE/workspace/linux-piano/out/rootfs-image"
          sudo -E env KVER="$KVER" \
            KERNEL_DIR="$O" \
            MODULES_DIR="$GITHUB_WORKSPACE/out/image/stage/modules" \
            DTB_DIR="$O/arch/arm64/boot/dts/qcom" \
            ./scripts/packages/build-kernel-deb.sh
          # gate：模块 vermagic 与内核版本串一致
          KO="$(find out/image/stage/modules/lib/modules/$KVER -name '*.ko' -print -quit 2>/dev/null)"
          [ -n "$KO" ] || { echo "::error::staging 无任何 .ko 模块"; exit 1; }
          V="$(modinfo -F vermagic "$KO")"
          echo "vermagic ($KO): $V"
          case "$V" in "$KVER "*) ;; *) echo "::error::vermagic 不匹配"; exit 1 ;; esac
          sudo dpkg-deb -I "linux-image-piano-kde_${KVER}_arm64.deb" > /dev/null
          echo "KVER=$KVER" >> "$GITHUB_ENV"

      - name: Collect bundle
        run: |
          mkdir -p out/bundle
          cp out/image/boot.img out/image/dtbo.img out/bundle/
          cp workspace/linux-piano/out/rootfs-image/.config out/bundle/kernel.config
          cp piano_rootfs.config.diff out/bundle/ 2>/dev/null || true
          cp kernel-patches.diff out/bundle/ 2>/dev/null || true
          {
            echo "kernel=$(cat workspace/linux-piano/out/rootfs-image/include/config/kernel.release)"
            echo "source=$GITHUB_WORKSPACE ${{ github.sha }}"
            echo "KUBUNTU-DIFF: root=PARTLABEL=linux-root; ext4; KDE Plasma (resolute); device-tested: no"
          } > out/bundle/MANIFEST.txt
          (cd out/bundle && sha256sum ./* > SHA256SUMS)

      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats || true

      - name: Prune this ref's older compiler caches
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" \
            --key piano-kde-clang- --limit 100 --json id --jq '.[].id' |
            xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY" || true

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: piano-kde-clang-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ART_FLASH }}
          path: out/bundle/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ART_KERNEL_DEB }}
          path: linux-image-piano-kde_*.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 4) build-rootfs：建镜像 → chroot 装配（全部 deb）→ gate → 收缩 → 上传
  # ---------------------------------------------------------------------------
  build-rootfs:
    name: Assemble Ubuntu RootFS (piano)
    needs: [components, kernel, packages]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      ROOTFS_PASSWORD: ${{ inputs.password || secrets.ROOTFS_PASSWORD || 'password' }}
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }

      - name: Parse Arguments
        id: parse
        run: |
          SERIES="${{ inputs.ubuntu_series }}"; SERIES="${SERIES%% *}"
          QUIET=false
          [ "${{ inputs.quiet_boot }}" = "true" ] && [ "${{ inputs.desktop }}" != "server" ] && QUIET=true
          case "${{ inputs.boot_mode }}" in
            "single (userdata)") LABEL="userdata" ;;
            "dual (linux-root)") LABEL="linux-root" ;;
            "custom")            LABEL="${{ inputs.custom_partition }}" ;;
            *) echo "::error::未知的 boot_mode: ${{ inputs.boot_mode }}"; exit 1 ;;
          esac
          {
            echo "series=${SERIES}"
            echo "label=${LABEL}"
            echo "quiet_boot_enabled=${QUIET}"
          } >> "$GITHUB_OUTPUT"
          echo "Ubuntu $SERIES / ${{ inputs.desktop }} / 分区 $LABEL"

      - name: Install Host Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mmdebstrap curl git e2fsprogs zstd

      - name: Download boot.img bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ART_FLASH }}
          path: out/kernel

      - name: Download kernel deb
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ART_KERNEL_DEB }}
          path: out/kernel

      - name: Download device debs (components)
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ART_COMPONENTS }}
          path: out/components

      - name: Download piano debs (userspace/firmware)
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ART_DEBS }}
          path: out/piano-debs

      - name: Collect all debs + derive KVER
        run: |
          mkdir -p debs
          find out/components out/piano-debs out/kernel -name '*.deb' -exec cp {} debs/ \;
          ls -la debs/
          [ "$(find debs -name '*.deb' | wc -l)" -ge 5 ] || { echo "::error::deb 数量不足"; exit 1; }
          # 先断言"内核 deb 在不在"，再解析版本号。两类失败混进一条报错会把
          # "上游产物缺失/名字漂移"误诊成"解析正则失效"（run 38523614571 实录：
          # pattern 打错 → 下载空手而归 → 40 分钟后报"无法解析 KVER"）。
          KDEB="$(ls debs/linux-image-piano-kde_*.deb 2>/dev/null | head -1 || true)"
          [ -n "$KDEB" ] || { echo "::error::debs/ 中没有 linux-image-piano-kde_*.deb（kernel job 未产出或 artifact 下载失败）"; exit 1; }
          KVER="$(sed -E 's/.*_([^_]+)_arm64\.deb/\1/' <<<"$KDEB")"
          [ -n "$KVER" ] || { echo "::error::无法从内核 deb 文件名解析 KVER: $KDEB"; exit 1; }
          echo "KVER=$KVER" >> "$GITHUB_ENV"
          echo "KVER=$KVER"

      - name: Create & Mount RootFS Image
        run: |
          chmod +x scripts/host/00-prepare-image.sh
          sudo bash scripts/host/00-prepare-image.sh rootfs.img "${{ inputs.rootfs_size }}" "$ROOTFS_MOUNT"

      - name: Bootstrap Ubuntu Base
        run: |
          chmod +x scripts/host/01-bootstrap.sh
          sudo env SERIES="${{ steps.parse.outputs.series }}" \
            bash scripts/host/01-bootstrap.sh "$ROOTFS_MOUNT"

      - name: Mount Chroot Environment
        run: |
          chmod +x scripts/host/02-mount-chroot.sh
          sudo bash scripts/host/02-mount-chroot.sh "$ROOTFS_MOUNT" debs

      - name: Write Build Environment
        run: |
          printf '%s\n' \
            "HOSTNAME=${{ inputs.hostname }}" \
            "USERNAME=${{ inputs.username }}" \
            "LANGUAGE=${{ inputs.language }}" \
            "AUTOLOGIN=${{ inputs.autologin }}" \
            "DESKTOP=${{ inputs.desktop }}" \
            "PARTITION_LABEL=${{ steps.parse.outputs.label }}" \
            "QUIET_BOOT=${{ steps.parse.outputs.quiet_boot_enabled }}" \
            "EXTRAS=${{ inputs.extras }}" \
            "KVER=${{ env.KVER }}" \
            | sudo tee "$ROOTFS_MOUNT/root/build.env" > /dev/null

      - name: "[chroot] Disable snap"
        run: sudo chroot "$ROOTFS_MOUNT" /root/piano-build/in-chroot/15-nosnap.sh

      - name: "[chroot] Install Base Packages"
        run: sudo chroot "$ROOTFS_MOUNT" /root/piano-build/in-chroot/10-base.sh

      - name: "[chroot] Install Desktop"
        run: sudo chroot "$ROOTFS_MOUNT" /root/piano-build/in-chroot/20-desktop.sh

      - name: "[chroot] Install Browser (optional)"
        if: contains(inputs.extras, 'browser-')
        run: |
          BROWSER=none
          case ",${{ inputs.extras }}," in *,browser-firefox,*) BROWSER=firefox ;; esac
          case ",${{ inputs.extras }}," in *,browser-chrome,*)  BROWSER=chrome  ;; esac
          sudo chroot "$ROOTFS_MOUNT" env BROWSER="$BROWSER" /root/piano-build/in-chroot/25-browser.sh

      - name: "[chroot] Install device packages (kernel deb + piano debs)"
        run: sudo chroot "$ROOTFS_MOUNT" /root/piano-build/in-chroot/30-device-packages.sh

      - name: "[chroot] Extras (fcitx5 / compression / dev-tools / docker)"
        run: |
          EXTRAS=",${{ inputs.extras }},"
          if [[ "$EXTRAS" == *,fcitx5,* ]]; then
            sudo chroot "$ROOTFS_MOUNT" bash -c 'apt-get update -qq && apt-get install -y -qq --no-install-recommends fcitx5 fcitx5-chinese-addons kde-config-fcitx5 2>/dev/null || apt-get install -y -qq --no-install-recommends fcitx5 fcitx5-chinese-addons'
            sudo install -D -m 0644 "$ROOTFS_MOUNT/root/piano-build/xdg-autostart/fcitx5.desktop" \
              "$ROOTFS_MOUNT/etc/xdg/autostart/fcitx5.desktop" 2>/dev/null || true
          fi
          if [[ "$EXTRAS" == *,compression,* ]]; then
            sudo chroot "$ROOTFS_MOUNT" bash -c 'apt-get install -y -qq --no-install-recommends p7zip-full unrar-free zip unzip'
          fi
          if [[ "$EXTRAS" == *,dev-tools,* ]]; then
            sudo chroot "$ROOTFS_MOUNT" bash -c 'apt-get install -y -qq --no-install-recommends build-essential cmake python3-dev git'
          fi
          if [[ "$EXTRAS" == *,docker,* ]]; then
            sudo chroot "$ROOTFS_MOUNT" bash -c 'apt-get install -y -qq docker.io && usermod -aG docker '"${{ inputs.username }}"' 2>/dev/null || true'
          fi

      - name: "[chroot] System config (user/password/locale/autologin/fstab)"
        run: >
          sudo chroot "$ROOTFS_MOUNT" env ROOTFS_PASSWORD="$ROOTFS_PASSWORD"
          /root/piano-build/in-chroot/40-system-config.sh

      - name: "[chroot] SSH auth (password / keys-only)"
        run: |
          if [ "${{ inputs.ssh_auth }}" = "keys-only" ]; then
            PUB="${{ vars.PIANO_SSH_PUBLIC_KEY }}"
            [ -n "$PUB" ] || { echo "::error::keys-only 需要 PIANO_SSH_PUBLIC_KEY 仓库变量"; exit 1; }
            printf '%s\n' "$PUB" | sudo tee "$ROOTFS_MOUNT/root/.ssh/authorized_keys" > /dev/null
            printf 'PasswordAuthentication no\nPubkeyAuthentication yes\n' \
              | sudo tee "$ROOTFS_MOUNT/etc/ssh/sshd_config.d/50-piano-auth.conf" > /dev/null
          else
            printf 'PasswordAuthentication yes\nPermitRootLogin no\n' \
              | sudo tee "$ROOTFS_MOUNT/etc/ssh/sshd_config.d/50-piano-auth.conf" > /dev/null
          fi

      - name: "[chroot] display-manager 链接兜底"
        run: |
          sudo chroot "$ROOTFS_MOUNT" bash -c             'test -e /etc/systemd/system/display-manager.service || ln -sf /usr/lib/systemd/system/sddm.service /etc/systemd/system/display-manager.service'

      - name: "[chroot] Verify (gate：不过不出包)"
        run: |
          sudo chroot "$ROOTFS_MOUNT" /root/piano-build/in-chroot/90-verify.sh
          KVER="${{ env.KVER }}"
          M="$ROOTFS_MOUNT"
          # --- piano 专属 gate（2026-10-14 首刷教训的结构性防线）---
          dpkg-query() { sudo chroot "$M" dpkg-query -W -f='${db:Status-Status}' "$1" 2>/dev/null; }
          [ "$(dpkg-query plasma-session-wayland)" = installed ] || { echo "::error::缺 plasma-session-wayland（wayland 会话桌面文件载体，autologin 失效根因）"; exit 1; }
          [ "$(dpkg-query libqt6virtualkeyboard6)" = installed ] || { echo "::error::缺 libqt6virtualkeyboard6（SDDM 虚拟键盘）"; exit 1; }
          [ "$(dpkg-query qml6-module-qtquick-virtualkeyboard)" = installed ] || { echo "::error::缺 qml6-module-qtquick-virtualkeyboard"; exit 1; }
          sudo test -f "$M/usr/share/wayland-sessions/plasma.desktop" || { echo "::error::缺 wayland 会话桌面文件"; exit 1; }
          sudo test -f "$M/usr/lib/modules/$KVER/modules.dep" || { echo "::error::缺 modules.dep（depmod 未跑）"; exit 1; }
          sudo test -x "$M/usr/bin/piano-touch-view" || { echo "::error::缺 piano-touch-view"; exit 1; }
          sudo test -f "$M/usr/lib/piano/busybox" || { echo "::error::缺 busybox"; exit 1; }
          sudo test -d "$M/usr/lib/firmware/ath12k/PEACH" || { echo "::error::缺 ath12k 固件"; exit 1; }
          sudo test -f "$M/usr/lib/systemd/system/piano-usb.service" || { echo "::error::缺 piano-usb 服务"; exit 1; }
          sudo test -L "$M/etc/systemd/system/display-manager.service" || { echo "::error::display-manager 链接缺失"; exit 1; }
          echo "=== piano gate 全部通过 ==="

      - name: Pack rootfs tree tar (optional, pre-shrink)
        if: inputs.produce_tar
        run: |
          mkdir -p out/tar
          sudo tar --numeric-owner --xattrs --acls -C "$ROOTFS_MOUNT" \
            -I 'zstd -T0 -3' -cf out/tar/rootfs-kubuntu-26.04-arm64.tar.zst .
          (cd out/tar && sha256sum ./* > SHA256SUMS)

      - name: Unmount Chroot Environment
        run: |
          chmod +x scripts/host/03-umount-chroot.sh
          sudo bash scripts/host/03-umount-chroot.sh "$ROOTFS_MOUNT"

      - name: Finalize Image (verify + shrink + UUID)
        run: |
          chmod +x scripts/host/04-finalize-image.sh
          sudo env SHRINK_IMAGE="${{ inputs.shrink_image }}" \
            bash scripts/host/04-finalize-image.sh rootfs.img "$ROOTFS_MOUNT"

      - name: "Write MANIFEST (device-tested marker)"
        run: |
          KVER="${{ env.KVER }}"
          {
            echo "kernel=$KVER"
            echo "source=$GITHUB_WORKSPACE ${{ github.sha }}"
            echo "ubuntu=${{ inputs.ubuntu_series }} desktop=${{ inputs.desktop }} ssh_auth=${{ inputs.ssh_auth }} autologin=${{ inputs.autologin }}"
            echo "KUBUNTU-DIFF: root=PARTLABEL=${{ steps.parse.outputs.label }}; ext4; KDE Plasma (resolute); device-tested: no"
            echo "WARNING: writing the linux-root partition is irreversible for its contents; keep persist untouched."
            echo "WARNING: flashing userdata destroys Android data; never fastboot flash userdata."
          } > MANIFEST.txt
          sha256sum rootfs.img >> MANIFEST.txt

      - uses: actions/upload-artifact@v4
        with:
          name: piano-rootfs-${{ steps.parse.outputs.label }}-${{ github.sha }}
          path: |
            rootfs.img
            MANIFEST.txt
            out/tar/*
          if-no-files-found: error
          compression-level: 1
          retention-days: 30